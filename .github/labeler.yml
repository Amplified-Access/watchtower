backend:
  - changed-files:
      - any-glob-to-any-file: ["backend/**"]

frontend:
  - changed-files:
      - any-glob-to-any-file: ["frontend/**"]

ci/cd:
  - changed-files:
      - any-glob-to-any-file: [".github/workflows/**", "Makefile", "backend/Makefile", "scripts/**"]

documentation:
  - changed-files:
      - any-glob-to-any-file: ["**/*.md", "backend/docs/**", "frontend/docs/**"]

dependencies:
  - changed-files:
      - any-glob-to-any-file:
          - "backend/go.mod"
          - "backend/go.sum"
          - "frontend/package.json"
          - "frontend/pnpm-lock.yaml"
          - "package.json"
          - "pnpm-lock.yaml"
